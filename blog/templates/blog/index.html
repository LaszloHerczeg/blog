{% extends "blog/base.html" %}

{% block content %}
        {%  if latest_post_list %}
            <ul>
                {%  for post in latest_post_list %}
                <li><a href="{% url 'blog:detail' post.id %}">{{ post.post_body }}</a></li>
                {%  endfor %}
            </ul>
        {%  else %}
            <p>There are no available post yet.</p>
    {% endif %}
{%  endblock %}
